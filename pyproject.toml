[project]
name = "market-lens"
version = "0.1.0"
description = "End-to-end stock market pipeline: yfinance -> Snowflake -> dbt -> Airflow -> Streamlit"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "dbt-core>=1.12.7",
    "dbt-snowflake>=1.12.5",
    "pandas>=3.1.1",
    "plotly>=7.1.0",
    "python-dotenv>=1.2.4",
    "snowflake-connector-python[pandas]>=5.2.0",
    "streamlit>=1.67.0",
    "yfinance>=1.8.0",
]
